<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar Example</title>
  <style>
    /* Navbar Container */
    nav {
      background-color: blue;
      padding: 15px;
    }

    /* Remove default UL styles */
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center; 
    }

    /* List items */
    nav ul li {
      margin: 0 20px;
    }

    /* Links */
    nav ul li a {
      text-decoration: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    /* Hover Effect */
    nav ul li a:hover {
      color: yellow;
    }
    .News-Container{
        height: 300px;
        width: 300px;
        background-color: aquamarine;
    }
    .News-Container img{
        height: 100px;
        width: 100px;
    }
    .News-Container h1{
        font-size: 20px;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Disclaimer</a></li>
      <li><a href="#">Contact Us</a></li>
      <li><a href="#">Privacy Policy</a></li>
      <li><a href="#">About Us</a></li>
    </ul>
  </nav>
  <div class="News-Container">
    <h1>Hello My Name Is Juhil</h1>
    <img src="OIP.jpg" alt="">
  </div>
</body>
</html>
